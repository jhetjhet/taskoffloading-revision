services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskoffloading}
      POSTGRES_USER: ${POSTGRES_USER:-taskoffloading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskoffloading}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./simulation_backend/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [taskoffloading-net]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [taskoffloading-net]

  seed:
    image: taskoffloading-simulation-api
    build:
      context: ./simulation_backend
      dockerfile: Dockerfile
    command: ["python", "-m", "simulation_backend.seed"]
    profiles: ["setup"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskoffloading}:${POSTGRES_PASSWORD:-taskoffloading}@postgres:5432/${POSTGRES_DB:-taskoffloading}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [taskoffloading-net]

  simulation-api:
    image: taskoffloading-simulation-api
    build:
      context: ./simulation_backend
      dockerfile: Dockerfile
    ports:
      - "${SIMULATION_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-taskoffloading}:${POSTGRES_PASSWORD:-taskoffloading}@postgres:5432/${POSTGRES_DB:-taskoffloading}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [taskoffloading-net]

  gbfs-edge:
    image: taskoffloading-simulation-worker
    build: { context: ./simulation_backend, dockerfile: Dockerfile }
    command: ["python", "-m", "simulation_backend.worker"]
    environment: { REDIS_URL: redis://redis:6379/0, SIMULATION_OWNER: GBFS:SERVER_A }
    depends_on: { redis: { condition: service_healthy } }
    networks: [taskoffloading-net]

  gbfs-cloud:
    image: taskoffloading-simulation-worker
    build: { context: ./simulation_backend, dockerfile: Dockerfile }
    command: ["python", "-m", "simulation_backend.worker"]
    environment: { REDIS_URL: redis://redis:6379/0, SIMULATION_OWNER: GBFS:SERVER_B }
    depends_on: { redis: { condition: service_healthy } }
    networks: [taskoffloading-net]

  pso-edge:
    image: taskoffloading-simulation-worker
    build: { context: ./simulation_backend, dockerfile: Dockerfile }
    command: ["python", "-m", "simulation_backend.worker"]
    environment: { REDIS_URL: redis://redis:6379/0, SIMULATION_OWNER: PSO:SERVER_A }
    depends_on: { redis: { condition: service_healthy } }
    networks: [taskoffloading-net]

  pso-cloud:
    image: taskoffloading-simulation-worker
    build: { context: ./simulation_backend, dockerfile: Dockerfile }
    command: ["python", "-m", "simulation_backend.worker"]
    environment: { REDIS_URL: redis://redis:6379/0, SIMULATION_OWNER: PSO:SERVER_B }
    depends_on: { redis: { condition: service_healthy } }
    networks: [taskoffloading-net]

  frontend:
    image: taskoffloading-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskoffloading-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      simulation-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - taskoffloading-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  taskoffloading-net:
    driver: bridge

volumes:
  postgres-data:
